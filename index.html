<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoCAD Hotkey & Command Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c10;
  --surface: #12151a;
  --surface-2: #181d24;
  --surface-hover: #1e242c;
  --border: #1f2730;
  --border-subtle: #1a2028;
  --text: #e8ecf1;
  --text-secondary: #8892a0;
  --text-muted: #5a6470;
  --accent: #00e5ff;
  --accent-dim: #00b8cc;
  --accent-glow: rgba(0, 229, 255, 0.15);
  --orange: #ff9f1c;
  --orange-dim: #cc7f16;
  --orange-glow: rgba(255, 159, 28, 0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Inter', -apple-system, sans-serif;
  --transition: cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 12, 16, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 2rem;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  color: var(--text);
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.header-brand svg {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
}

.header-brand .accent { color: var(--accent); }

.header-search {
  flex: 1;
  max-width: 520px;
  position: relative;
}

.header-search input {
  width: 100%;
  padding: 0.6rem 1rem 0.6rem 2.75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s var(--transition), box-shadow 0.2s var(--transition);
}

.header-search input::placeholder { color: var(--text-muted); }

.header-search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.header-search svg {
  position: absolute;
  left: 0.85rem;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}

/* Progress bar */
.progress-bar {
  position: fixed;
  top: 64px;
  left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--orange));
  z-index: 99;
  transition: width 0.1s linear;
  border-radius: 0 1px 1px 0;
}

/* Layout */
.layout {
  display: flex;
  min-height: calc(100vh - 64px);
}

/* Sidebar */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  border-right: 1px solid var(--border-subtle);
  padding: 1.5rem 0;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
  overflow-y: auto;
}

.sidebar-section {
  padding: 0 1.25rem;
  margin-bottom: 1.5rem;
}

.sidebar-title {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 0.75rem;
  padding-left: 0.5rem;
}

.sidebar-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius-sm);
  text-decoration: none;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.sidebar-link:hover { color: var(--text); background: var(--surface); }
.sidebar-link.active { color: var(--accent); background: var(--accent-glow); }
.sidebar-link .count {
  margin-left: auto;
  font-size: 0.7rem;
  color: var(--text-muted);
  background: var(--surface-2);
  padding: 0.1rem 0.4rem;
  border-radius: 4px;
  font-family: var(--font-mono);
}

.sidebar-link.active .count { background: rgba(0, 229, 255, 0.1); color: var(--accent); }

/* Main content */
.main {
  flex: 1;
  padding: 2rem 2.5rem 4rem;
  max-width: 1400px;
}

.section-header {
  margin-bottom: 2rem;
}

.section-title {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text);
  margin-bottom: 0.25rem;
}

.section-subtitle {
  color: var(--text-secondary);
  font-size: 0.9rem;
}

/* Command grid */
.command-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1rem;
}

/* Command card */
.card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 1.25rem;
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  transition: border-color 0.2s var(--transition), box-shadow 0.2s var(--transition), transform 0.2s var(--transition);
  position: relative;
  overflow: hidden;
}

.card:hover {
  border-color: var(--border);
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}

.card-thumb {
  width: 88px;
  height: 56px;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: var(--surface-2);
  cursor: pointer;
  transition: box-shadow 0.2s;
}

.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
  transition: opacity 0.2s, transform 0.3s;
}

.card:hover .card-thumb img { opacity: 1; transform: scale(1.05); }

.card-thumb .play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.4);
  opacity: 0;
  transition: opacity 0.2s;
}

.card-thumb:hover .play-overlay { opacity: 1; }

.card-thumb .play-overlay svg {
  width: 22px;
  height: 22px;
  color: white;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.card-thumb .clip-time {
  position: absolute;
  bottom: 3px;
  right: 3px;
  background: rgba(0, 0, 0, 0.75);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 0.6rem;
  padding: 1px 4px;
  border-radius: 3px;
  font-weight: 600;
}

.card-body { flex: 1; min-width: 0; }

.card-cmd {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.02em;
  margin-bottom: 0.15rem;
}

.card-name {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.3rem;
}

.card-desc {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-key {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  margin-top: 0.5rem;
}

.key-badge {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 600;
  background: var(--surface-2);
  color: var(--orange);
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  border: 1px solid var(--border-subtle);
  letter-spacing: 0.02em;
}

.card-copy {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s, color 0.2s, background 0.2s;
}

.card:hover .card-copy { opacity: 1; }
.card-copy:hover { color: var(--accent); background: var(--accent-glow); border-color: var(--accent-dim); }
.card-copy svg { width: 13px; height: 13px; }
.card-copy.copied { color: var(--accent); border-color: var(--accent); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s var(--transition);
}

.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 800px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  transform: scale(0.95);
  transition: transform 0.3s var(--transition);
}

.modal-overlay.open .modal { transform: scale(1); }

.modal-video {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: #000;
}

.modal-video iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.modal-info {
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
}

.modal-info-text { flex: 1; }
.modal-info-cmd {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 0.15rem;
}
.modal-info-name { font-size: 1.1rem; font-weight: 700; color: var(--text); }
.modal-info-time { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem; font-family: var(--font-mono); }

.modal-close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: color 0.2s, background 0.2s;
}
.modal-close:hover { color: var(--text); background: var(--border); }
.modal-close svg { width: 16px; height: 16px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}

.empty-state svg { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.4; }

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.6rem 1.25rem;
  border-radius: var(--radius);
  font-size: 0.85rem;
  font-weight: 500;
  box-shadow: var(--shadow);
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  white-space: nowrap;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast .toast-accent { color: var(--accent); font-family: var(--font-mono); font-weight: 600; }

/* Responsive */
@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%;
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border-subtle);
    padding: 1rem;
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    flex-wrap: wrap;
  }
  .sidebar-section { padding: 0; margin-bottom: 0; }
  .sidebar-title { display: none; }
  .sidebar-list { flex-direction: row; gap: 0.4rem; }
  .sidebar-link { white-space: nowrap; padding: 0.4rem 0.7rem; }
  .main { padding: 1.5rem 1rem 3rem; }
  .command-grid { grid-template-columns: 1fr; }
  .header { padding: 0 1rem; }
  .header-brand span { display: none; }
}

@media (max-width: 600px) {
  .header-search { max-width: 200px; }
  .modal-overlay { padding: 0.5rem; }
}
</style>
</head>

// ─── Category configuration ─────────────────────────────────────
const CATEGORIES = [
  { id:'all', name:'All Commands', icon:'◫' },
  { id:'Drawing', name:'Drawing', icon:'✎' },
  { id:'Modifying', name:'Modifying', icon:'⟳' },
  { id:'Annotation', name:'Annotation', icon:'☰' },
  { id:'Layers', name:'Layers', icon:'☷' },
  { id:'Blocks', name:'Blocks', icon:'▣' },

  { id:'Settings', name:'Settings', icon:'⚙' },
  { id:'Management', name:'Management', icon:'☲' }
];

// ─── State ───────────────────────────────────────────────────────
let currentCategory = 'all';
let currentSearch = '';
let currentCmd = null;

// ─── DOM refs ────────────────────────────────────────────────────
const $grid = document.getElementById('commandGrid');
const $empty = document.getElementById('emptyState');
const $search = document.getElementById('searchInput');
const $catList = document.getElementById('categoryList');
const $modalOverlay = document.getElementById('modalOverlay');
const $modalVideo = document.getElementById('modalVideo');
const $modalCmd = document.getElementById('modalCmd');
const $modalName = document.getElementById('modalName');
const $modalTime = document.getElementById('modalTime');
const $modalClose = document.getElementById('modalClose');
const $progressBar = document.getElementById('progressBar');
const $toast = document.getElementById('toast');
const $sectionTitle = document.getElementById('sectionTitle');
const $sectionSubtitle = document.getElementById('sectionSubtitle');

// ─── Helpers ────────────────────────────────────────────────────
function getVideo(cmd) {
  const entry = VIDEO_DB[cmd.key] || VIDEO_DB[cmd.key.toUpperCase()];
  if (entry) return entry;
  // Try alternate key aliases
  for (const k of Object.keys(VIDEO_DB)) {
    if (cmd.key.startsWith(k) || k.startsWith(cmd.key)) return VIDEO_DB[k];
  }
  return FALLBACK_VIDEO;
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}

function thumbUrl(videoId) {
  return 'https://img.youtube.com/vi/' + videoId + '/mqdefault.jpg';
}

function toast(msg) {
  $toast.innerHTML = msg;
  $toast.classList.add('show');
  setTimeout(() => $toast.classList.remove('show'), 2000);
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => {});
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

// ─── Render ─────────────────────────────────────────────────────
function renderSidebar() {
  $catList.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'sidebar-link' + (currentCategory === cat.id ? ' active' : '');
    const count = cat.id === 'all' ? COMMANDS.length : COMMANDS.filter(c => c.category === cat.id).length;
    btn.innerHTML = `<span>${cat.icon}</span> ${cat.name}<span class="count">${count}</span>`;
    btn.onclick = () => { currentCategory = cat.id; render(); };
    li.appendChild(btn);
    $catList.appendChild(li);
  });
}

function renderGrid() {
  let items = COMMANDS;
  if (currentCategory !== 'all') items = items.filter(c => c.category === currentCategory);
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    items = items.filter(c =>
      c.key.toLowerCase().includes(q) ||
      c.name.toLowerCase().includes(q) ||
      (c.keys || '').toLowerCase().includes(q) ||
      (c.desc || '').toLowerCase().includes(q)
    );
  }

  $sectionTitle.textContent = currentCategory === 'all' ? 'All Commands' : CATEGORIES.find(c => c.id === currentCategory)?.name || '';
  $sectionSubtitle.textContent = items.length + ' command' + (items.length !== 1 ? 's' : '') + (currentSearch ? ' matching search' : '');

  if (items.length === 0) {
    $grid.style.display = 'none';
    $empty.style.display = 'block';
    return;
  }

  $grid.style.display = 'grid';
  $empty.style.display = 'none';
  $grid.innerHTML = '';

  items.forEach((cmd, i) => {
    const v = getVideo(cmd);
    const dur = v.end - v.start;
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (Math.min(i, 30) * 0.02) + 's';
    card.innerHTML = `
      <div class="card-thumb" data-video="${v.videoId}" data-start="${v.start}" data-end="${v.end}" data-title="${v.title || cmd.name}">
        <img src="${thumbUrl(v.videoId)}" alt="" loading="lazy" onerror="this.style.display='none'">
        <div class="play-overlay"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg></div>
        <div class="clip-time">${fmtTime(dur)}s</div>
      </div>
      <div class="card-body">
        <div class="card-cmd">${cmd.key}</div>
        <div class="card-name">${cmd.name}</div>
        <div class="card-desc">${cmd.desc}</div>
        <div class="card-key"><span class="key-badge">${cmd.keys}</span></div>
      </div>
      <button class="card-copy" data-cmd="${cmd.key}" title="Copy command">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      </button>
    `;
    $grid.appendChild(card);
  });

  // Bind events
  $grid.querySelectorAll('.card-thumb').forEach(el => {
    el.addEventListener('click', () => {
      openModal({
        videoId: el.dataset.video,
        start: parseInt(el.dataset.start),
        end: parseInt(el.dataset.end),
        title: el.dataset.title
      });
    });
  });

  $grid.querySelectorAll('.card-copy').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const cmdKey = el.dataset.cmd;
      copyText(cmdKey);
      el.classList.add('copied');
      toast(`Copied <span class="toast-accent">${cmdKey}</span> to clipboard`);
      setTimeout(() => el.classList.remove('copied'), 1500);
    });
  });
}

function render() {
  renderSidebar();
  renderGrid();
  updateProgress();
}

// ─── Modal / YouTube Player ─────────────────────────────────────
let ytPlayer = null;

function openModal(video) {
  currentCmd = video;
  $modalCmd.textContent = (currentSearch ? '' : (COMMANDS.find(c => getVideo(c).videoId === video.videoId)?.key || '')) + ' clip';
  $modalName.textContent = video.title || 'Tutorial';
  $modalTime.textContent = fmtTime(video.start) + ' – ' + fmtTime(video.end) + ' (' + (video.end - video.start) + 's)';
  $modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Inject iframe
  const vidUrl = 'https://www.youtube.com/embed/' + video.videoId +
    '?start=' + video.start +
    '&end=' + video.end +
    '&autoplay=1&rel=0&modestbranding=1&enablejsapi=1';
  $modalVideo.innerHTML = '<iframe src="' + vidUrl + '" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
}

function closeModal() {
  $modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
  $modalVideo.innerHTML = '';
  currentCmd = null;
}

$modalClose.addEventListener('click', closeModal);
$modalOverlay.addEventListener('click', (e) => {
  if (e.target === $modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $modalOverlay.classList.contains('open')) closeModal();
});

// ─── Progress bar ───────────────────────────────────────────────
function updateProgress() {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const progress = maxScroll > 0 ? (window.scrollY / maxScroll) * 100 : 0;
  $progressBar.style.width = progress + '%';
}

// ─── Search ─────────────────────────────────────────────────────
let searchTimeout;
$search.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    currentSearch = $search.value.trim();
    render();
  }, 150);
});

window.addEventListener('scroll', updateProgress, { passive: true });

// ─── Init ───────────────────────────────────────────────────────
render();
</script>
